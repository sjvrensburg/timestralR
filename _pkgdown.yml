url: https://sjvrensburg.github.io/timestralR/

# docs/ holds the developer notes, so the site is built elsewhere.
destination: site

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#FA500F"
    navbar-bg: "#14141F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
  includes:
    in_header: |
      <meta name="google-site-verification" content="-A7LEQuYZAN5X9vi3GvAeEQm4Z2Ts911HRdYEOaFc_I" />
      <meta name="keywords" content="time series forecasting, R, Timestral, Mistral AI, foundation model, zero-shot, probabilistic forecast, safetensors, tsibble, fable">
      <meta name="twitter:card" content="summary_large_image">
      <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"SoftwareSourceCode","name":"timestralR","description":"Zero-shot probabilistic time-series forecasting in R with Mistral AI's Timestral foundation models. No Python or PyTorch needed.","url":"https://sjvrensburg.github.io/timestralR/","codeRepository":"https://github.com/sjvrensburg/timestralR","programmingLanguage":"R","license":"https://www.apache.org/licenses/LICENSE-2.0","author":{"@type":"Person","name":"Stefan Janse van Rensburg"}}
      </script>
  opengraph:
    image:
      src: social-card.png
      alt: "timestralR: zero-shot probabilistic forecasting with Timestral in R"

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, github, lightswitch]

home:
  title: "timestralR: Zero-shot probabilistic forecasting with Timestral in R"
  description: >-
    Run Mistral AI's Timestral time-series foundation models from R. Zero-shot
    probabilistic forecasts with 21 quantiles, covariates, tsibble/fable and
    ggplot2 support, and no Python or PyTorch.

reference:
- title: Models
  desc: Download, load and inspect Timestral checkpoints.
  contents:
  - timestral_load
  - timestral_download
  - timestral_supports_covariates
- title: Forecasting
  contents:
  - timestral_forecast
  - predict.timestral_model
  - timestral_median
  - timestral_quantile
  - timestral_levels
- title: Evaluation
  desc: Score forecasts and run rolling-origin backtests.
  contents:
  - timestral_score
  - timestral_backtest
- title: Plotting
  contents:
  - plot.timestral_forecast
  - autoplot.timestral_forecast
- title: Interfaces
  desc: Conversions and methods for tsibble, fable and the forecast package.
  contents:
  - as_forecast_df
  - as_tsibble.timestral_forecast
  - TIMESTRAL
  - as_fable.timestral_forecast
  - forecast.timestral_model
  - timestral_as_forecast
- title: Package
  contents:
  - timestralR-package
